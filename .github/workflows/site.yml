name: build-site

# Rebuilds the public dashboard and publishes it to GitHub Pages:
#   * right after every daily-collect run (so the page shows the newest data)
#   * whenever site code changes on main
#   * on demand ("Run workflow" button)
on:
  workflow_run:
    workflows: ["daily-collect"]
    types: [completed]
  push:
    branches: [main]
    paths: ["src/**", "site/**", ".github/workflows/site.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write        # publish to GitHub Pages
  id-token: write     # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # after daily-collect, only rebuild if collection succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main     # newest commit, including today's data snapshot

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build page
        run: python -m src.build_site --out _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
