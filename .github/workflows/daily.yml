name: daily-collect

on:
  schedule:
    # 06:41 UTC daily (~22:41 Seattle). Rankings for the previous UTC day are
    # published around 02:00 UTC; an off-the-hour minute avoids cron congestion.
    - cron: "41 6 * * *"
  workflow_dispatch: {}        # "Run workflow" button for manual runs / backfill

permissions:
  contents: write              # needed to commit the new snapshot

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect snapshots
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.collect daily

      - name: Commit data
        if: always()           # keep whatever succeeded even if one source failed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "data: snapshot $(date -u +%F)"
            git push
          fi
# A failed run (non-zero exit from collect.py) makes GitHub email the repo
# owner, which is the "alert on failure" from the plan.
